  <script>
    (function () {
      var btn = document.getElementById('searchToggleBtn');
      var wrap = document.getElementById('tbSearchWrap');
      if (btn && wrap) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = wrap.style.display !== 'none';
          wrap.style.display = isOpen ? 'none' : '';
          if (!isOpen) {
            var input = document.getElementById('f_search');
            if (input) input.focus();
          }
        });

        document.addEventListener('click', function (e) {
          if (wrap.style.display !== 'none' && !wrap.contains(e.target) && e.target !== btn) {
            wrap.style.display = 'none';
          }
        });
      }

      var userWrap = document.querySelector('.tb-user');
      var avatar = document.querySelector('.user-avatar');
      if (userWrap && avatar) {
        avatar.addEventListener('click', function (e) {
          e.stopPropagation();
          userWrap.classList.toggle('open');
        });

        avatar.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            userWrap.classList.toggle('open');
          }
        });

        document.addEventListener('click', function (e) {
          if (userWrap.classList.contains('open') && !userWrap.contains(e.target)) {
            userWrap.classList.remove('open');
          }
        });
      }
    })();
  </script>
